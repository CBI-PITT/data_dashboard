[dashboard]
# Enable/disable the whole dashboard blueprint. When disabled, no routes are
# registered and the PEACE navbar link is hidden.
enabled = True

# Storage backend: parquet | elasticsearch
# parquet        - DuckDB + Parquet files on disk (no services, default)
# elasticsearch  - an ElasticSearch cluster/instance (for very large datasets)
backend = parquet

# Directory where per-dataset files are stored, one folder per user:
#   <datasets_dir>/<username>/<name>.parquet + <name>.dashboard_meta.json
#   (elasticsearch: sidecar meta only; the data lives in ES)
# Ownerless/legacy files at the root are visible to admins only.
# This directory is created if it does not exist.
datasets_dir = /h20/CBI/Iana/dashboard/test

# Usernames (comma separated) that can see and access every user's datasets.
admins = CBI_Admin

# Optional: browsable-root fallback for the Add-to-dashboard endpoint when the
# flask_file_browser package is not installed. One root per name, the name is
# unused.
[allowed_csv_dirs]
# example = /h20/CBI/Iana/projects

[backend_elasticsearch]
# Only read when [dashboard] backend = elasticsearch. The elasticsearch python
# package is imported lazily, so parquet-only deployments do not need it.
es_server = http://localhost:9200
index_shards = 1
