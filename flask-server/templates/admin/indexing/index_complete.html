<!DOCTYPE html>
<html>
<head>
  <title>Indexing Complete</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #4caf50;
      margin-bottom: 20px;
      text-align: center;
    }
    p {
      /* color: #333; */
      line-height: 1.6;
      margin-bottom: 15px;
      text-align: left;
    }
    ul {
      padding-left: 20px;
      margin-bottom: 15px;
    }
    li {
      margin-bottom: 5px;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Indexing Complete!</h1>
    <p>Additional Information:</p>
    <p>
      The indexing process for file "{{ file_name }}" has been successfully completed. You can now:
    </p>
    <ul>
      <li><a href="/admin/indexinfo">Edit the information</a> for all the fields</li>
      <li><a href="/admin/parameters">Check the parameters</a> you just set and modify if needed</li>
      <li><a href="/admin/fileuploadview">Index</a>  other files</li>
    </ul>
    <!-- Add more information here if needed -->
  </div>
</body>
</html>
