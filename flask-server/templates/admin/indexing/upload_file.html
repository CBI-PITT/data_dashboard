{% extends 'admin/master.html' %} {% block body %}
<!DOCTYPE html>
<html>
  <head>
    <title>File Upload</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
        /* display: flex;
        justify-content: center;
        align-items: center; */
        height: 100vh;
      }

      .container2 {
        padding: 2px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 3px 4px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .container3 {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      h1 {
        color: #333;
        margin-bottom: 20px;
      }

      input[type="file"] {
        border: 2px dashed #ccc;
        border-radius: 6px;
        padding: 20px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 20px;
        font-size: 16px;
      }

      input[type="file"]:hover {
        border-color: #999;
      }

      input[type="submit"] {
        cursor: pointer;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background-color: #3498db;
        color: #fff;
        transition: background-color 0.3s ease;
        font-size: 16px;
      }

      input[type="submit"]:hover {
        background-color: #2980b9;
      }
      .dropdowns-section {
        text-align: center;
        margin-bottom: 20px;
        display: flex;
        /* justify-content: flex-start; */
        align-items: center;
      }

      .dropdowns-section label {
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
        color: #555;
      }

      .dropdowns-section select {
        padding: 10px;
        border-radius: 5px;
        /* border: 1px solid #ccc; */
        font-size: 16px;
        margin-right: 10px;
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, gray 50%),
          linear-gradient(135deg, gray 50%, transparent 50%);
        background-position: calc(100% - 10px) calc(1em + 2px),
          calc(100% - 5px) calc(1em + 2px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        /* color: #555; */
        cursor: pointer;
      }
      .form-section {
            margin-bottom: 20px;
            width: 90%;
            margin: 0 auto;
            border-radius: 6px;
        }

        .form-section label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #555;
        }

        .form-section input {
            width: calc(100% - 20px);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .form-section::after {
            content: '';
            display: block;
            margin-bottom: 20px;
            margin-top: 5px;
        }
    </style>
  </head>
  <body>
    <div class="container2">
        <h1>Upload a File</h1>
        <div class="container3">
            <form action="/indexing/upload_file" method="POST" enctype="multipart/form-data" onsubmit="uploading()">
                <input type="file" name="file" accept=".csv" required />
                <div class="dropdowns-section">
                    <label for="separator">Separate by:</label>
                    <select id="separator" name="separator">
                        <option value="comma" selected>comma (,)</option>
                        <option value="tab">tab(\t)</option>
                        <option value="semicolon">semicolon(;)</option>
                        <option value="space">space( )</option>
                    </select>
                    <br /><br />
                    <label for="delimiter">String delimiter:</label>
                    <select id="delimiter" name="delimiter">
                        <option value="double_quote" selected>double_quote (")</option>
                        <option value="single_quote">single_quote (')</option>
                    </select>
                    <br /><br />
                </div>
                <div class="form-section">
                  <label for="index_name">Index Name:</label>
                  <!-- Create a text input field with a datalist -->
                  <input type="text" id="index_name" name="index_name" list="indexNames" autocomplete="off" placeholder="Choose from existed index or creat new one" required>
                  <!-- Define the datalist with various options -->
                  <datalist id="indexNames">
                      {% for index in indexNamesArray %}
                      <option value="{{ index }}"></option>
                      {% endfor %}
                  </datalist>
              </div>
                <input type="submit" value="Upload" id="uploadButton"/>
            </form>
        </div>
    </div>
    <script>
        function uploading() {
            var uploadButton = document.getElementById('uploadButton');
            uploadButton.value = 'Uploading...'; // Change button text
            uploadButton.disabled = true; // Disable the button
            return true; // Continue with form submission
        }
    </script>
</body>
</html>
{% endblock %}
