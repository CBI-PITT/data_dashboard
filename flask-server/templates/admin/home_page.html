{% extends 'admin/master.html' %} {% block body %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to Flask-Admin</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
