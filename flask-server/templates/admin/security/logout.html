<!DOCTYPE html>
<html>
  <head>
    <title>Logged Out</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .logout-container {
        background-color: #fff;
        border-radius: 8px;
        padding: 40px;
        box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      h1 {
        margin-bottom: 30px;
        color: #333;
        font-size: 28px;
        font-weight: 600;
      }
      p {
        margin-bottom: 20px;
        color: #666;
      }
      a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="logout-container">
      <h1>Logged Out</h1>
      <p>You have been successfully logged out.</p>
      <p><a href="/admin">Back to Log In</a></p>
    </div>
  </body>
</html>
